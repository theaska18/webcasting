<svg width="250" height="50" viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Gradient Icon -->
    <linearGradient id="gradPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Gradient Text -->
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <rect x="5" y="10" width="40" height="40" rx="12" fill="url(#gradPrimary)" filter="url(#glow)"/>
  
  <!-- Letter C -->
  <path d="M33 20 A10 10 0 1 0 33 40"
        stroke="white"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>
  
  <circle cx="33" cy="30" r="2" fill="white" opacity="0.9"/>

  <!-- Brand Text (diturunkan sedikit) -->
  <text x="60" y="38"
        font-family="Inter, Segoe UI, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="0.5"
        fill="url(#gradText)">
    CKamal CMS
  </text>
</svg>